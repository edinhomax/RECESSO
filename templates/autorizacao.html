<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Autorização — {{ employee_name }}</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: Arial, Helvetica, sans-serif;
    color: #1a1a1a;
    background: #eef0f3;
    margin: 0;
    padding: 40px 16px;
  }
  .page {
    max-width: 720px;
    margin: 0 auto;
    background: #fff;
    padding: 64px 56px 96px;
    box-shadow: 0 1px 4px rgba(0,0,0,.12);
  }
  h1 {
    font-size: 19px;
    text-align: center;
    text-decoration: underline;
    text-underline-offset: 4px;
    margin: 0 0 56px;
  }
  p.corpo {
    font-size: 15px;
    text-align: justify;
    line-height: 1.7;
    margin: 0 0 72px;
  }
  p.data-local {
    font-size: 15px;
    margin: 0 0 140px;
  }
  .assinatura {
    text-align: center;
    max-width: 340px;
    margin: 0 auto;
  }
  .linha {
    border-top: 1px solid #1a1a1a;
    margin-bottom: 6px;
  }
  .nome {
    font-size: 14px;
    font-weight: 700;
  }
  .rotulo {
    font-size: 12px;
    color: #555;
  }
  .toolbar {
    max-width: 720px;
    margin: 0 auto 16px;
    text-align: right;
  }
  .toolbar button {
    background: #2563eb;
    color: #fff;
    border: none;
    padding: 10px 20px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .toolbar button:hover { background: #1d4ed8; }

  @media print {
    body { background: #fff; padding: 0; }
    .toolbar { display: none; }
    .page { box-shadow: none; padding: 40px 8px 0; max-width: 100%; }
  }
</style>
</head>
<body>
  <div class="toolbar">
    <button onclick="window.print()">Imprimir / Salvar PDF</button>
  </div>

  <div class="page">
    <h1>Autorização para Desconto em Férias</h1>

    <p class="corpo">Autorizo o desconto de {{ dias_num }} ({{ dias_extenso }}) {{ dia_plural }} do meu período de férias, referente {{ periodo_texto }}, por motivos particulares.</p>

    <p class="data-local">{{ cidade }}, {{ hoje_extenso }}.</p>

    <div class="assinatura">
      <div class="linha"></div>
      <div class="nome">{{ employee_name }}</div>
      <div class="rotulo">Assinatura do Funcionário</div>
    </div>
  </div>
</body>
</html>
